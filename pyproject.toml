[project]
name = "agentic-commerce"
version = "0.1.0"
description = "Permissioned purchasing workflows with durable commerce execution"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "mcp==2.3.0",
  "authlib==1.9.4",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "http-message-signatures==3.0.0",
  "jwcrypto==1.6.1",
  "sd-jwt==0.10.4",
  "jsonschema==4.26.0",
  "rfc8785>=0.1,<1",
  "ap2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio==1.3.0",
 "pytest-cov>=6,<8",
 "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: requires a real PostgreSQL test database", "live_model: consumes signed-in Codex allowance"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.uv]
override-dependencies = ["cryptography==50.0.2", "jwcrypto==1.6.1", "pydantic==2.14.2", "pytest==9.2.0"]

[tool.uv.sources]
ap2 = { git = "https://github.com/google-agentic-commerce/AP2.git", rev = "b4587ac1d055888a73b4b21750973cffba961793" }
